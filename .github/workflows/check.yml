name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in install.sh uninstall.sh scripts/*.sh; do bash -n "$f"; done

      - name: Validate skills
        run: bash scripts/check.sh
